<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% if site.chrome_mobile_color %}
  <meta name="theme-color" content="{{ site.chrome_mobile_color }}">
  {% endif %}
  {% seo %}

  <!-- Favicon -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">

  <!-- Plugins CSS -->
  <link rel="stylesheet" href="{{ '/assets/plugins/font-awesome/css/fontawesome.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/plugins/font-awesome/css/solid.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/plugins/font-awesome/css/brands.min.css' | relative_url }}">

  <!-- Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
