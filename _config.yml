# Site Settings
title: Adam Kauffman Resume
url: 'https://adamkauffman.dev'
description: Professional CV for Adam Burck Kauffman

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never

# Build settings
encoding: "utf-8"

liquid:
  error_mode: strict
  strict_filters: true

exclude:
  - CNAME
  - README.md
  - docker-compose.yml
  - scripts
  - start
