# Site Settings
title: Adam Kauffman Resume
url: 'https://adamkauffman.dev'
description: Professional CV for Adam Burck Kauffman

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
encoding: "utf-8"

exclude:
  - .gitattributes
  - .github/
  - .gitignore
  - .idea/
  - .jekyll-cache/
  - .jekyll-metadata
  - .ruby-version
  - .sass-cache/
  - .tool-versions
  - CNAME
  - Gemfile
  - Gemfile.lock
  - README.md
  - docker-compose.yml
  - gemfiles/
  - node_modules/
  - start
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
