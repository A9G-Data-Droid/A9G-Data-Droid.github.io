<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body>
  <div class="wrapper">
    <button
      type="button"
      class="theme-toggle"
      id="theme-toggle"
      aria-label="Switch to dark mode"
      aria-pressed="false"
      title="Switch to dark mode"
    >
      <span class="theme-toggle-icon theme-toggle-icon--sun" aria-hidden="true">{% include icon.html name="sun" %}</span>
      <span class="theme-toggle-icon theme-toggle-icon--moon" aria-hidden="true">{% include icon.html name="moon" %}</span>
    </button>

    {% include sidebar.html %}

    <main class="main-wrapper">
      {{ content }}
    </main>
  </div>

  {% include footer.html %}

  {% include scripts.html %}
</body>

</html>
